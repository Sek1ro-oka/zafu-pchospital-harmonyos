// 补充交互预览，非 ArkUI 运行/截图；所有状态仅内存，无请求、存储或实际业务。
const categories=['全部','开机','系统','网络','散热'];
const guides=[{id:'demo-boot',category:'开机',title:'开机无响应：记录现象',body:'这是导航演示样本，不是设备诊断。正式页面将显示知识库正文、来源与可见性，不要依据本样本拆机。'},{id:'demo-network',category:'网络',title:'校园网络连接问题',body:'自编演示文本，展示阅读结构，不来自真实知识或模型。'},{id:'demo-heat',category:'散热',title:'发热与风扇现象记录',body:'自编演示样本，不代表维修结论；公开阅读不能获得内部备案权限。'}];
const personal=['个人资料','我的报修','我的报名','我的收藏','站内消息','购物订单','卖家订单','我发布的商品','我的帖子'];
let tab=0,role='游客',paths=[],pending='',pendingGuideId='',category='全部',query='',state='内容',forum=false,savedIds=[],notice='',reduce=false,guideId='demo-boot',touchX=null;
const screen=document.querySelector('#screen'),nav=document.querySelector('#nav');
const staff=()=>role==='工作人员'||role==='管理员';
const future=t=>['选购待接入','发布二手商品','购物订单','卖家订单','我发布的商品'].includes(t)?'选购功能建设中，暂无法下单':t==='我的帖子'?'论坛功能建设中':'演示版尚未接入此服务';
function el(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e}
function text(t,cls){screen.append(el('p',t,cls))}function title(t,s){screen.append(el('h1',t));if(s)text(s)}
function btn(t,fn,sub){const e=el('button',t,sub!==undefined?'link':'');if(sub!==undefined)e.append(el('small',sub));e.onclick=fn;screen.append(e);return e}
function hero(t,s){const e=el('div','hero');e.className='hero';e.textContent='';e.append(el('h2',t),el('p',s));const i=el('img');i.src='../../app/entry/src/main/resources/base/media/home_diagnosis_hero.svg';i.alt='项目电脑维修主题插画';e.append(i);screen.append(e)}
function open(t){paths.push(t);render()}function back(){if(paths.at(-1)==='登录'){pending='';pendingGuideId=''}paths.pop();render()}
function openGuide(id){guideId=id;notice='';open('阅读指南')}
function select(i){if(i===4&&role==='游客'){pending='@my';open('登录')}else{tab=i;render()}}
function guard(t){if(role==='游客'){pending=t;pendingGuideId=t==='收藏操作'?guideId:'';open('登录')}else if(t==='收藏操作'){const existed=savedIds.includes(guideId);savedIds=existed?savedIds.filter(id=>id!==guideId):savedIds.concat(guideId);notice=existed?'演示收藏已取消':'演示收藏已加入（仅内存）';render()}else open(t)}
function login(r){role=r;const t=pending;if(t==='收藏操作'&&pendingGuideId)guideId=pendingGuideId;pending='';pendingGuideId='';paths.pop();if(t==='@my'){tab=4;render()}else if(t)guard(t);else render()}
function reset(r){role=r;savedIds=[];notice='';pending='';pendingGuideId='';paths=[];if(r==='游客')tab=0;render()}
function knowledge(name){text('演示样本 · 不代表真实知识库','tag');if(name==='知识中心'){
const lead=el('div','','diagnostic');lead.append(img('ref_shield'));const ai=el('button','AI 故障问诊','blue');ai.onclick=()=>open('AI 问诊');lead.append(ai);screen.append(lead);heading('获取帮助');text('按故障类型查阅演示指南');categories.slice(1).forEach(c=>{const b=tile(c+'故障','⌄',()=>{category=c;query='';open('知识目录')});b.classList.add('fault')});btn('全部知识目录',()=>open('知识目录'),'按分类浏览指南与案例');btn('知识搜索',()=>open('知识搜索'),'搜索演示指南');return}
if(name==='知识搜索'){const input=el('input');input.placeholder='搜索演示指南标题';input.value=query;input.oninput=()=>{query=input.value;const pos=input.selectionStart;render();const next=screen.querySelector('input');next.focus();next.setSelectionRange(pos,pos)};screen.append(input)}else btn('搜索演示指南',()=>open('知识搜索'),'保留分类上下文');
const found=guides.filter(g=>(category==='全部'||g.category===category)&&g.title.includes(query.trim()));
if(name==='知识目录'){const row=el('div','','catalog'),aside=el('aside'),body=el('div','','catalogbody');categories.forEach(c=>{const b=el('button',c,c===category?'active':'');b.onclick=()=>{category=c;render()};aside.append(b)});body.append(el('h2',category+'维修指南'));found.forEach(g=>{const b=el('button',g.title,'link');b.append(el('small','演示指南 · 查看 ›'));b.onclick=()=>openGuide(g.id);body.append(b)});if(!found.length)body.append(el('p','暂无该类演示指南'));row.append(aside,body);screen.append(row)}else{
const chips=el('div','','chips');categories.forEach(c=>{const b=el('button',c,c===category?'active':'');b.onclick=()=>{category=c;render()};chips.append(b)});screen.append(chips);const states=el('div','','chips');['内容','加载','空态','失败'].forEach(s=>{const b=el('button',s,s===state?'active':'');b.onclick=()=>{state=s;render()};states.append(b)});screen.append(states);
if(state==='加载')text('演示加载中 · 点击“内容”结束','empty');else if(state==='失败'){text('演示读取失败，未发出真实请求');btn('重试',()=>{state='内容';render()})}else if(state==='空态'||!found.length){text('暂无匹配的演示指南','empty');btn('查看全部',()=>{state='内容';category='全部';query='';render()})}else found.forEach(g=>btn(g.title,()=>openGuide(g.id),'演示指南 · '+g.category))}btn('公开案例 / 内部案例',()=>open('案例可见性'),'公开与内部权限边界保持')}

const base='../../app/entry/src/main/resources/base/media/';
function img(name){const i=el('img');i.src=base+name+'.svg';i.alt='';return i}
function icon(t){return t.includes('问诊')||t.includes('帮助')?'ref_shield':t.includes('收藏')?'ref_star':t.includes('报修')||t.includes('处理')?'ref_repair':t.includes('网络')?'ref_network':t.includes('散热')||t.includes('工具')?'ref_cooling':t.includes('系统')?'ref_system':t.includes('开机')?'ref_boot':t.includes('活动')||t.includes('报名')?'ref_flag':t.includes('消息')||t.includes('帖子')?'ref_message':t.includes('资料')?'ref_profile':t.includes('电脑')||t.includes('笔记本')?'reading_laptop':t.includes('磁盘')||t.includes('存储')?'ref_disk':'ref_document'}
function heading(t){screen.append(el('h2',t))}
function entry(t){if(t==='知识与帮助'||t==='维修指南')open('知识中心');else if(t==='近期活动'||t==='校园活动')select(1);else if(t==='校园选购')select(3);else if(t==='AI 问诊')open('AI 问诊');else if(['处理报修','维修备案','备案审核','活动现场'].includes(t))open(staff()?t:'工作人员权限');else guard(t)}
function tool(name,label,fn){const b=el('button','','tool');b.append(img(name));b.setAttribute('aria-label',label);b.onclick=fn;return b}
function pageTop(t){const row=el('div','','top');row.append(el('h1',t),el('span','演示版','badge'),tool('home_headset','知识与帮助',()=>open('知识中心')),tool('ref_grid','演示设置',()=>open('演示设置')));screen.append(row)}
function searchbar(t,fn){const b=el('button',null,'search');b.append(img('home_search'),el('span',t));b.onclick=fn;screen.append(b)}
function dots(){const d=el('div','','dots');for(let i=0;i<5;i++)d.append(el('i'));screen.append(d)}
function shortcuts(ts,cards=false,shop=false){const row=el('div','',cards?'shortcuts cards':'shortcuts');ts.forEach(t=>{const b=el('button');b.append(img(icon(t)),el('span',t));b.onclick=()=>shop?open('选购待接入'):entry(t);row.append(b)});screen.append(row)}
function tile(t,sub,fn){const b=el('button','','tile');b.append(img(icon(t)));const copy=el('div');copy.append(el('b',t),el('small',sub));b.append(copy);b.onclick=fn||(()=>entry(t));screen.append(b);return b}
function banner(cls,t,sub,asset,action,fn){const b=el('div','',`banner ${cls}`);b.append(img(asset));const copy=el('div','','copy');copy.append(el('h2',t),el('p',sub));if(action){const a=el('button',action);a.onclick=fn;copy.append(a)}b.append(copy);screen.append(b)}
function empty(t,sub,asset='ref_flag',action='',fn=null){const c=el('div','','emptycard');c.append(img(asset),el('h2',t),el('p',sub));if(action){const b=el('button',action);b.onclick=fn;c.append(b)}screen.append(c)}
function group(t,fn){const parent=screen;const div=el('div','','whitegroup');screen.append(div);const before=screen.childNodes.length;heading(t);fn();while(screen.childNodes.length>before)div.append(screen.childNodes[before])}
function render(){screen.replaceChildren();screen.scrollTop=0;const page=paths.at(-1);screen.className=!page&&tab===0?'home':'';nav.hidden=!!page;nav.style.display=page?'none':'flex';nav.replaceChildren();if(page){const b=btn('‹ 返回',back);b.id='back';text('纯前端演示 · 未连接真实业务','tag');if(page!=='阅读指南'){const h=el('h1',page);h.id='subhead';screen.append(h)}
if(page==='演示设置'){text('只改内存状态，不改变真实账号权限');['游客','客户','工作人员','管理员'].forEach(r=>btn('切换演示'+r,()=>reset(r),'返回主页面'));const label=el('label','减少动态效果（演示） ');const check=el('input');check.type='checkbox';check.style.width='auto';check.checked=reduce;check.onchange=()=>reduce=check.checked;label.append(check);screen.append(label);text('关闭横滑；不是读取系统设置。浏览器仅展示状态，原生动画以 HAP 为准。')}
else if(page==='登录'){text('无账号密码，不访问鉴权服务');text('原操作：'+(pending==='@my'?'我的':pending));btn('作为演示客户继续',()=>login('客户'),'成功续接一次');btn('作为演示工作人员继续',()=>login('工作人员'),'不自动获得管理员权限');btn('取消，回到原页面',back)}
else if(['知识中心','知识目录','知识搜索'].includes(page))knowledge(page);
else if(page==='个人资料'){const panel=el('div','','profileSheet');panel.append(img('profile_avatar'),el('h1','演示'+role),el('p','离线演示身份 · 未连接账号'));screen.append(panel);btn('个人信息',()=>open('个人信息'),'演示版暂不可编辑真实资料')}else if(page==='阅读指南'){const banner=el('div','','readingBanner');banner.append(el('h2','维修指南'),img('reading_guide_hero'));screen.append(banner);const g=guides.find(g=>g.id===guideId);title(g.title,'演示指南 · '+g.category);text('现象记录 · 排查说明 · 来源');screen.append(el('h2','现象记录'));text(g.body);btn('查看来源',()=>open('来源说明'),'演示资料，不伪造引用');btn(savedIds.includes(guideId)?'取消收藏这篇指南':'收藏这篇指南',()=>guard('收藏操作'),'仅当前篇目 · 游客按需登录');if(notice)text(notice,'notice');btn('进入 AI 问诊',()=>open('AI 问诊'),'不生成回答')}
else if(page==='来源说明')text('来源：自编 Demo 样本，不是文献、真实维修备案或 AI 回答。正式迁移保留引用 ID、可见性和原内容跳转。');
else if(page==='我的收藏'){const saved=guides.filter(g=>savedIds.includes(g.id));if(!saved.length)text('暂无演示收藏');saved.forEach(g=>btn(g.title,()=>openGuide(g.id),'已收藏的演示指南 · '+g.category))}
else if(page==='站内消息'){text('演示消息深链入口，不代表真实消息或收藏。');btn('打开演示指南',()=>openGuide('demo-boot'),'指定 demo-boot 的演示消息链接')}

else if(page==='工作人员权限')text('此入口需要工作人员身份，演示版未加载任何内部业务内容。');else if(page==='备案审核'&&role!=='管理员')text('演示工作人员无审核权限。正式权限由服务端核实。');
