server {
    listen 80;
    server_name harmony-api.pczafu.cn;
    location /.well-known/acme-challenge/ { root /var/lib/letsencrypt/pchospital-shared; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name harmony-api.pczafu.cn;
    ssl_certificate /etc/letsencrypt/live/harmony-api.pczafu.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harmony-api.pczafu.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:13080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }
}
